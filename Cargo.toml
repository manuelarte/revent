[package]
name = "revent"
version = "0.0.2"
edition = "2024"
license = "MIT"
authors = [
    "manuelarte <manueldoncelmartos@gmail.com>",
]
repository = "https://github.com/manuelarte/revent"

[dependencies]
#keep-sorted start
async-trait = "0.1"
axum = "0.8.9"
chrono = { version = "0.4.45", features = ["serde"] }
dotenvy = "0.15.7"
envy = "0.4.2"
futures-core = "0.3"
hostname = "0.4.2"
humantime-serde = "1.1.1"
mime_guess = "2.0"
opentelemetry = { version = "0.32.0" }
opentelemetry-appender-tracing = "0.32.0"
opentelemetry-otlp = { version = "0.32.0", features = ["grpc-tonic", "logs", "trace"] }
opentelemetry-stdout = { version = "0.32.0", features = ["logs", "trace"] }
opentelemetry_sdk = { version = "0.32.1", features = ["logs", "rt-tokio", "trace"] }
prost = "0.14"
prost-types = "0.14"
rune-axum-sanitize = "0.1.0"
rust-embed = { version = "8.4", features = ["axum"] }
rustc_tools_util = "0.4.2"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0"
sqlx = { version = "0.9.0", features = ["sqlite", "runtime-tokio", "tls-native-tls", "chrono"] }
tokio = { version = "1", features = ["full"] }
tokio-stream = "0.1.18"
tonic = "0.14"
tonic-prost = "0.14.6"
tracing            = { version = "0.1.44" }
tracing-opentelemetry = "0.33.0"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
uuid = { version = "1.23.3", features = ["v4", "serde"] }
#keep-sorted end

[build-dependencies]
tonic-prost-build = { version = "0.14.6" }
rustc_tools_util = "0.4.2"

[dev-dependencies]
cucumber = "0.23.0"
reqwest = { version = "0.13.4", default-features = false, features = ["json", "rustls"] }

[[test]]
name = "bdd"
harness = false  # allows Cucumber to print output instead of libtest

[workspace.metadata.dylint]
libraries = [
    { git = "https://github.com/trailofbits/dylint", pattern = "examples/general" },
    { git = "https://github.com/trailofbits/dylint", pattern = "examples/restriction/try_io_result" },
    { git = "https://github.com/manuelarte/funcorder-rs" },
]
