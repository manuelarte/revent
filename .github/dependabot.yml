---
version: 2
updates:
  - package-ecosystem: cargo
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    commit-message:
      prefix: "chore"
    cooldown:
      default-days: 7

  - package-ecosystem: pip
    directory: "/examples/python-client"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore"
    cooldown:
      default-days: 7
